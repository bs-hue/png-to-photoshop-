<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <sp-heading size="XS">PNG → Layers</sp-heading>
        <span id="serverDot" class="dot dot--unknown" title="Backend status"></span>
      </header>

      <section class="section">
        <sp-detail>BACKEND</sp-detail>
        <div class="row">
          <sp-textfield id="serverUrl" class="grow" value="http://127.0.0.1:8000" placeholder="http://127.0.0.1:8000"></sp-textfield>
          <sp-action-button id="pingBtn" quiet>Ping</sp-action-button>
        </div>
        <sp-body size="XS" id="engineInfo" class="muted">Engines: unknown</sp-body>
      </section>

      <sp-divider size="small"></sp-divider>

      <section class="section">
        <sp-detail>PIPELINE</sp-detail>
        <sp-checkbox id="optText" checked>Extract Text (OCR)</sp-checkbox>
        <sp-checkbox id="optObjects" checked>Isolate Objects</sp-checkbox>
        <sp-checkbox id="optInpaint" checked>Inpaint Background</sp-checkbox>
        <sp-checkbox id="optHideSource" checked>Hide source layers</sp-checkbox>
        <sp-checkbox id="optRasterText">Keep raster copy of text</sp-checkbox>
      </section>

      <section class="section">
        <sp-button id="decomposeBtn" variant="cta">Decompose Active Canvas</sp-button>
        <sp-button id="pickFileBtn" variant="primary">Select Image &amp; Decompose</sp-button>
        <sp-button id="openPsdBtn" variant="secondary" disabled>Open Compiled PSD</sp-button>
      </section>

      <section class="section">
        <div class="progress-head">
          <sp-detail id="progressLabel">IDLE</sp-detail>
          <sp-detail id="progressPct">0%</sp-detail>
        </div>
        <div class="progress"><div id="progressFill" class="progress__fill"></div></div>
      </section>

      <section class="section section--grow">
        <div class="progress-head">
          <sp-detail>STATUS LOG</sp-detail>
          <sp-action-button id="clearLogBtn" quiet>Clear</sp-action-button>
        </div>
        <div id="log" class="log"></div>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
