<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monochrome Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>Dashboard</h1>
      <div class="profile">U</div>
    </header>
    <section class="grid">
      <div class="card">
        <h2>Recent Activity</h2>
        <p>No recent events.</p>
      </div>
      <div class="card">
        <h2>Tasks</h2>
        <p>3 pending tasks.</p>
      </div>
      <div class="card">
        <h2>Metrics</h2>
        <p>Visitors: 1,234</p>
      </div>
      <div class="card">
        <h2>Settings</h2>
        <p>Quick toggle options.</p>
      </div>
    </section>
    <footer class="footer">© 2026 My Company – Minimal Monochrome UI</footer>
  </div>
</body>
</html>
